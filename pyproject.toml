[project]
name = "logit-gate-rag"
version = "0.1.0"
description = "High-precision, ultra-low-latency RAG gate & filtering pipeline using Ruri dense retrieval and Qwen2.5 pointwise logit classification."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

